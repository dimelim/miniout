services:
  db:
    image: mysql:8.4
    container_name: miniout-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:3307:3306'
    environment:
      MYSQL_DATABASE: miniout
      MYSQL_USER: miniout
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=60
      - --performance-schema=OFF
    volumes:
      - miniout-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'miniout', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  miniout-db-data:
